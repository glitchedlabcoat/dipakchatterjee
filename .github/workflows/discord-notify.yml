name: Discord Notify

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + production build)
        id: build
        run: npm run build

      # Runs whether the steps above passed or failed, so both a clean
      # push and a broken build get reported to Discord.
      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set — skipping Discord notification."
            exit 0
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            STATUS_TEXT="Build succeeded"
            COLOR=3066993
          else
            STATUS_TEXT="Build failed"
            COLOR=15158332
          fi

          # This workflow only ever runs on GitHub Actions itself, so
          # this will always resolve to "Remote" — kept as a genuine
          # environment check (mirroring scripts/notify-discord.js's
          # detectBuildSource(), which covers the local-push case)
          # rather than a hardcoded label, so both notification paths
          # derive the source the same way.
          if [ -n "$RENDER" ] || [ -n "$CI" ] || [ -n "$GITHUB_ACTIONS" ]; then
            BUILD_SOURCE="Remote (Repo / Render)"
          else
            BUILD_SOURCE="Local (Development Environment)"
          fi

          # First line of the commit message, used as the embed's short
          # description. jq's --arg (below) safely encodes every value —
          # including multi-line commit messages and any quotes they
          # contain — as JSON strings, so nothing here can break the
          # payload or inject into the request.
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)

          PAYLOAD=$(jq -n \
            --arg status "$STATUS_TEXT" \
            --arg color "$COLOR" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg sha "${COMMIT_SHA:0:7}" \
            --arg title "$COMMIT_TITLE" \
            --arg message "$COMMIT_MESSAGE" \
            --arg author "$COMMIT_AUTHOR" \
            --arg commit_url "$COMMIT_URL" \
            --arg run_url "$RUN_URL" \
            --arg build_source "$BUILD_SOURCE" \
            '{
              embeds: [{
                title: ($status + ": " + $repo + "@" + $branch),
                description: $title,
                url: $run_url,
                color: ($color | tonumber),
                fields: [
                  { name: "Author", value: $author, inline: true },
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Commit", value: ("[" + $sha + "](" + $commit_url + ")"), inline: true },
                  { name: "Build Source", value: $build_source, inline: true },
                  { name: "Full message", value: $message }
                ],
                footer: { text: "View the run" }
              }]
            }')

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
